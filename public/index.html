<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shortlist</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 16 16%27%3E%3Crect x=%273%27 y=%273%27 width=%2710%27 height=%2710%27 rx=%272%27 fill=%27%235b2a86%27/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:ital,wght@0,400..800;1,400..600&display=swap" rel="stylesheet" />
  <!-- Build 2: paste the PostHog web snippet here and capture "run_clicked", "posting_opened", "filter_changed". -->
  <style>
    :root {
      --ink: #1d1b2a;
      --ink-soft: #4a4759;
      --paper: #f4f4f8;
      --surface: #ffffff;
      --rule: #dddbe6;
      --violet: #5b2a86;
      --violet-soft: #ece4f4;
      --high: #1e6b47;
      --mid: #9a6400;
      --low: #7c7a8c;
      --brick: #a8322a;
      --radius-control: 8px;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      font-family: "Schibsted Grotesk", "Avenir Next", "Segoe UI", system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      color: var(--ink);
      background: var(--paper);
    }
    a { color: var(--violet); }
    :focus-visible { outline: 2px solid var(--violet); outline-offset: 2px; }

    .page { max-width: 1240px; margin: 0 auto; padding: 32px 24px 80px; }

    /* Top bar */
    .top { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    .wordmark { font-size: 28px; font-weight: 800; letter-spacing: -0.03em; margin: 0; }
    .wordmark span { display: inline-block; width: 10px; height: 10px; background: var(--violet); border-radius: 2px; margin-left: 4px; vertical-align: 2px; }
    .mode { font-size: 14px; color: var(--ink-soft); margin: 2px 0 0; }
    .mode strong { color: var(--ink); font-weight: 600; }
    .run-btn {
      font: inherit; font-weight: 600; font-size: 16px;
      padding: 12px 22px; border: 0; border-radius: var(--radius-control);
      background: var(--violet); color: #fff; cursor: pointer;
    }
    .run-btn:hover { background: #4a1f70; }
    .run-btn[disabled] { opacity: 0.7; cursor: progress; }

    /* Funnel sentence */
    .funnel { margin: 28px 0 8px; font-size: 20px; line-height: 1.45; max-width: 60ch; }
    .funnel b { font-weight: 700; font-variant-numeric: tabular-nums; }
    .funnel .new { color: var(--violet); }
    .subtle { color: var(--ink-soft); font-size: 14px; margin: 0; }

    /* Controls */
    .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin: 28px 0 8px; padding-bottom: 16px; border-bottom: 1px solid var(--rule); }
    .tracks { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      font: inherit; font-size: 14px; padding: 6px 12px; border-radius: 999px;
      border: 1px solid var(--rule); background: var(--surface); color: var(--ink); cursor: pointer;
    }
    .chip[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
    .chip .n { font-variant-numeric: tabular-nums; opacity: 0.65; margin-left: 4px; }
    .toggles { display: flex; gap: 16px; align-items: center; font-size: 14px; margin-left: auto; }
    .toggles label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
    select { font: inherit; font-size: 14px; padding: 4px 6px; border-radius: 6px; border: 1px solid var(--rule); background: var(--surface); }

    /* Ranked list: the score rail is the one loud element */
    .list { list-style: none; margin: 0; padding: 0; }
    /* Two columns: 2027 and new grad roles on the left, other open full-time roles on the right */
    .columns { display: grid; grid-template-columns: 1fr 1fr; gap: 0 48px; margin-top: 8px; }
    .col-head { font-size: 20px; font-weight: 750; letter-spacing: -0.01em; margin: 20px 0 2px; display: flex; align-items: baseline; gap: 10px; }
    .col-head .n { font-size: 15px; font-weight: 600; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
    .col-grad .col-head { color: var(--violet); }
    .col-sub { margin: 0 0 6px; font-size: 14px; color: var(--ink-soft); max-width: 52ch; }
    .col-empty { padding: 20px 0; color: var(--ink-soft); font-size: 15px; border-top: 1px solid var(--rule); }
    .row { display: grid; grid-template-columns: 64px 1fr; gap: 4px 16px; padding: 20px 0; border-top: 1px solid var(--rule); }
    .score { font-size: 40px; font-weight: 800; line-height: 1; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; text-align: right; }
    .score small { display: block; font-size: 12px; font-weight: 500; letter-spacing: 0; color: var(--ink-soft); margin-top: 6px; }
    .band-high .score { color: var(--high); }
    .band-mid .score { color: var(--mid); }
    .band-low .score { color: var(--low); }
    .blocked .score { color: var(--low); }
    .blocked .score .num { text-decoration: line-through; text-decoration-thickness: 3px; text-decoration-color: var(--brick); }
    .title { font-size: 17px; font-weight: 650; margin: 0; line-height: 1.3; }
    .title a { color: var(--ink); text-decoration: none; }
    .title a:hover { text-decoration: underline; }
    .where { margin: 2px 0 10px; color: var(--ink-soft); font-size: 15px; }
    .tags { display: inline-flex; gap: 6px; margin-left: 8px; vertical-align: 3px; }
    .tag { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 4px; background: #eceaf2; color: var(--ink-soft); }
    .tag.is-new { background: var(--violet-soft); color: var(--violet); }
    .why, .gap, .stop { margin: 0 0 4px; font-size: 15px; max-width: 68ch; }
    .gap { color: var(--ink-soft); }
    .stop { color: var(--brick); font-weight: 600; }
    .why b, .gap b { font-weight: 600; }
    .open { grid-column: 2; justify-self: start; margin-top: 8px; align-self: start; font-size: 14px; font-weight: 600; padding: 8px 14px; border: 1px solid var(--rule); border-radius: var(--radius-control); background: var(--surface); color: var(--ink); text-decoration: none; white-space: nowrap; }
    .open:hover { border-color: var(--ink); }

    .empty { padding: 48px 0; max-width: 52ch; }
    .empty h2 { font-size: 22px; margin: 0 0 8px; }

    /* Dropped + errors */
    details { margin-top: 32px; }
    summary { cursor: pointer; font-weight: 600; font-size: 16px; }
    .dropped { margin: 12px 0 0; padding: 0; list-style: none; font-size: 14px; }
    .dropped li { padding: 6px 0; border-bottom: 1px solid var(--rule); display: flex; justify-content: space-between; gap: 16px; }
    .dropped .r { color: var(--ink-soft); white-space: nowrap; }
    .errors { margin-top: 24px; padding: 14px 16px; border-left: 3px solid var(--brick); background: #fbefee; font-size: 14px; }
    .errors p { margin: 0 0 4px; }

    @media (max-width: 980px) {
      .columns { grid-template-columns: 1fr; }
    }
    @media (max-width: 640px) {
      .row { grid-template-columns: 52px 1fr; }
      .score { font-size: 32px; }
      .toggles { margin-left: 0; }
      .funnel { font-size: 18px; }
      .dropped li { flex-direction: column; gap: 0; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .columns.fresh .row { animation: settle 360ms ease-out both; }
      @keyframes settle { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="top">
      <div>
        <h1 class="wordmark">Shortlist<span aria-hidden="true"></span></h1>
        <p class="mode" id="mode">Loading...</p>
      </div>
      <button class="run-btn" id="run" type="button">Check my list</button>
    </div>

    <p class="funnel" id="funnel" aria-live="polite"></p>
    <p class="subtle" id="when"></p>

    <div class="controls" id="controls" hidden>
      <div class="tracks" id="tracks" role="group" aria-label="Filter by track"></div>
      <div class="toggles">
        <label><input type="checkbox" id="newOnly" /> New only</label>
        <label>Min fit
          <select id="minFit">
            <option value="0">Any</option>
            <option value="50">50+</option>
            <option value="70">70+</option>
          </select>
        </label>
      </div>
    </div>

    <div id="message"></div>
    <div class="columns" id="columns" hidden>
      <section class="col col-grad" aria-labelledby="gradHead">
        <h2 class="col-head" id="gradHead">2027 and new grad <span class="n" id="gradCount"></span></h2>
        <p class="col-sub">New grad, campus, MBA 2027 and rotational programs.</p>
        <ol class="list" id="listGrad"></ol>
      </section>
      <section class="col col-open" aria-labelledby="openHead">
        <h2 class="col-head" id="openHead">Full-time, open now <span class="n" id="openCount"></span></h2>
        <p class="col-sub">Other full-time roles that passed your filters.</p>
        <ol class="list" id="listOpen"></ol>
      </section>
    </div>
    <div id="dropped"></div>
    <div id="errors"></div>
  </div>

  <script>
    // Everything shown here comes from outside job boards, so every string goes through esc() before it touches the page.
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c]));
    const $ = (id) => document.getElementById(id);
    const TRACK_ORDER = ["Full-time", "Program", "Internship", "Fellowship", "Pre-doc"];
    const view = { track: "All", newOnly: false, minFit: 0 };
    let data = null;
    let st = null;

    function ago(iso) {
      if (!iso) return "";
      const mins = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
      if (mins < 1) return "just now";
      if (mins < 60) return `${mins} min ago`;
      const hrs = Math.round(mins / 60);
      if (hrs < 24) return `${hrs} hr ago`;
      const days = Math.round(hrs / 24);
      return `${days} day${days === 1 ? "" : "s"} ago`;
    }
    function posted(days) {
      if (days === null || days === undefined) return "";
      if (days <= 0) return "posted today";
      return `posted ${days} day${days === 1 ? "" : "s"} ago`;
    }
    function band(r) {
      if (r.dealbreaker) return "blocked";
      if (r.fit >= 75) return "band-high";
      if (r.fit >= 50) return "band-mid";
      return "band-low";
    }

    function renderMode() {
      if (!st) return;
      $("mode").innerHTML = st.demo
        ? "<strong>Demo data.</strong> Fictional postings, keyword scoring, no API calls."
        : st.aiOn
          ? `<strong>${st.watchlistCount} companies.</strong> Scoring with ${esc(st.model)} through OpenRouter.`
          : `<strong>${st.watchlistCount} companies.</strong> Keyword scoring. Add OPENROUTER_API_KEY to .env for AI scoring.`;
    }

    function renderFunnel() {
      const s = data?.summary;
      if (!s) {
        $("funnel").textContent = "";
        $("when").textContent = "";
        return;
      }
      if (!s.found) {
        $("funnel").innerHTML = `Checked <b>${s.companies}</b> companies and found no open roles.`;
        $("when").textContent = `Last checked ${ago(s.runAt)}.`;
        return;
      }
      $("funnel").innerHTML =
        `Checked <b>${s.companies.toLocaleString()}</b> companies and found <b>${s.found.toLocaleString()}</b> open roles. ` +
        `<b>${s.passedFilter.toLocaleString()}</b> passed your filters` + (s.gradCount ? ` (<b>${s.gradCount.toLocaleString()}</b> scored so far are aimed at 2027 or new grads), ` : ", ") +
        `and <b class="new">${s.newCount} ${s.newCount === 1 ? "is" : "are"} new</b> since your last check.`;
      const cost = s.method === "ai" ? ` This check scored ${s.scoredThisRun ?? s.scored} roles for $${s.costUsd.toFixed(4)} (${s.tokensIn.toLocaleString()} tokens in, ${s.tokensOut.toLocaleString()} out).` : "";
      const reused = s.fromCache ? ` ${s.fromCache.toLocaleString()} scores were reused from earlier checks.` : "";
      const waiting = s.waiting ? ` ${s.waiting.toLocaleString()} more matches will be scored on your next checks.` : "";
      const reset = s.cacheReset ? " Your profile changed, so earlier scores were cleared." : "";
      $("when").textContent = `Last checked ${ago(s.runAt)}.${cost}${reused}${waiting}${reset}`;
    }

    function renderControls() {
      const results = data?.results || [];
      $("controls").hidden = results.length === 0;
      const counts = Object.fromEntries(TRACK_ORDER.map((t) => [t, 0]));
      results.forEach((r) => { counts[r.track] = (counts[r.track] || 0) + 1; });
      const options = ["All", ...TRACK_ORDER.filter((t) => counts[t])];
      $("tracks").innerHTML = options.map((t) => {
        const n = t === "All" ? results.length : counts[t];
        return `<button class="chip" type="button" data-track="${esc(t)}" aria-pressed="${view.track === t}">${esc(t)}<span class="n">${n}</span></button>`;
      }).join("");
    }

    function rowHtml(r) {
      const score = r.fit === null ? "?" : r.fit;
      const label = r.error ? "not scored" : "fit";
      return `<li class="row ${r.error ? "band-low" : band(r)}">
        <div class="score" aria-label="Fit ${esc(score)} out of 100"><span class="num">${esc(score)}</span><small>${label}</small></div>
        <div>
          <h3 class="title"><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)}</a>
            <span class="tags">${r.isNew ? `<span class="tag is-new">New</span>` : ""}<span class="tag">${esc(r.track)}</span></span>
          </h3>
          <p class="where">${esc(r.company)}, ${esc(r.location || "location not listed")}${r.ageDays !== null && r.ageDays !== undefined ? `, ${posted(r.ageDays)}` : ""}</p>
          ${r.dealbreaker ? `<p class="stop">Dealbreaker: ${esc(r.dealbreaker)}</p>` : ""}
          ${r.why ? `<p class="why"><b>Why it fits:</b> ${esc(r.why)}</p>` : ""}
          ${r.gap ? `<p class="gap"><b>Gap:</b> ${esc(r.gap)}</p>` : ""}
          ${r.error ? `<p class="stop">Could not score: ${esc(r.error)}</p>` : ""}
        </div>
        <a class="open" href="${esc(r.url)}" target="_blank" rel="noopener" data-id="${esc(r.id)}">Open posting</a>
      </li>`;
    }

    function showMessage(title, body) {
      $("columns").hidden = true;
      $("message").innerHTML = title ? `<div class="empty"><h2>${title}</h2><p>${body}</p></div>` : "";
    }

    function renderList(fresh) {
      const all = data?.results || [];
      $("columns").classList.toggle("fresh", Boolean(fresh));

      if (!data?.summary) {
        return showMessage("No check yet", `Press Check my list to pull every open role from the ${st?.watchlistCount ?? ""} companies in your watchlist, filter them, and rank what's left against your profile.`);
      }
      if (!all.length) {
        const failed = data.summary.boardsFailed;
        return failed
          ? showMessage("No roles came back", `${failed} of ${data.summary.companies} boards could not be checked (details below). Run npm run check in the terminal to test each board name and your connection.`)
          : showMessage("No roles passed your filters", `Open "Filtered out" below to see what was cut and why, then loosen data/preferences.json.`);
      }

      const rows = all.filter((r) =>
        (view.track === "All" || r.track === view.track) &&
        (!view.newOnly || r.isNew) &&
        ((r.fit ?? 0) >= view.minFit));
      if (!rows.length) {
        return showMessage("Nothing matches these filters", `Clear "New only" or lower the minimum fit to see more.`);
      }

      showMessage("");
      $("columns").hidden = false;
      const grad = rows.filter((r) => r.cohort === "2027 grad");
      const open = rows.filter((r) => r.cohort !== "2027 grad");
      $("gradCount").textContent = grad.length;
      $("openCount").textContent = open.length;
      $("listGrad").innerHTML = grad.length ? grad.map(rowHtml).join("") : `<li class="col-empty">No 2027 or new grad roles in this view.</li>`;
      $("listOpen").innerHTML = open.length ? open.map(rowHtml).join("") : `<li class="col-empty">No other open roles in this view.</li>`;
    }

    function renderDropped() {
      const dropped = data?.dropped || [];
      const total = data?.droppedCount ?? dropped.length;
      if (!total) { $("dropped").innerHTML = ""; return; }
      const reasons = (data?.droppedByReason || []).map((r) => `${esc(r.reason)}: ${r.count.toLocaleString()}`).join(". ");
      const showing = dropped.length < total ? ` Showing the first ${dropped.length.toLocaleString()}.` : "";
      $("dropped").innerHTML = `<details>
        <summary>Filtered out (${total.toLocaleString()})</summary>
        <p class="subtle" style="margin-top:8px">These never reached scoring. If a good role is in here, loosen data/preferences.json.${showing}</p>
        ${reasons ? `<p class="subtle" style="margin-top:6px">${reasons}.</p>` : ""}
        <ul class="dropped">${dropped.map((d) => `<li><span>${esc(d.title)}, ${esc(d.company)}</span><span class="r">${esc(d.reason)}</span></li>`).join("")}</ul>
      </details>`;
    }

    function renderErrors() {
      const errors = data?.errors || [];
      $("errors").innerHTML = errors.length
        ? `<div class="errors" role="status"><p><strong>${errors.length} board${errors.length === 1 ? "" : "s"} could not be checked.</strong> Run npm run check to test each one.</p>${errors.map((e) => `<p>${esc(e.company)}: ${esc(e.error)}</p>`).join("")}</div>`
        : "";
    }

    function renderAll(fresh) {
      renderMode(); renderFunnel(); renderControls(); renderList(fresh); renderDropped(); renderErrors();
    }

    async function load() {
      [st, data] = await Promise.all([
        fetch("/api/status").then((r) => r.json()),
        fetch("/api/latest").then((r) => r.json())
      ]);
      renderAll(false);
    }

    $("run").addEventListener("click", async () => {
      const btn = $("run");
      btn.disabled = true;
      btn.textContent = `Checking ${st?.watchlistCount ?? ""} boards...`;
      try {
        const res = await fetch("/api/run", { method: "POST" });
        const json = await res.json();
        if (!res.ok) throw new Error(json.error || `HTTP ${res.status}`);
        data = json;
        st = await fetch("/api/status").then((r) => r.json());
        renderAll(true);
      } catch (err) {
        $("errors").innerHTML = `<div class="errors" role="alert"><p><strong>The check stopped:</strong> ${esc(err.message)}</p><p>Check the terminal where npm start is running for details.</p></div>`;
      } finally {
        btn.disabled = false;
        btn.textContent = "Check my list";
      }
    });

    $("tracks").addEventListener("click", (e) => {
      const chip = e.target.closest(".chip");
      if (!chip) return;
      view.track = chip.dataset.track;
      renderControls(); renderList(false);
    });
    $("newOnly").addEventListener("change", (e) => { view.newOnly = e.target.checked; renderList(false); });
    $("minFit").addEventListener("change", (e) => { view.minFit = Number(e.target.value); renderList(false); });

    setInterval(renderFunnel, 60000);
    load();
  </script>
</body>
</html>
